services:
  triagem:
    build: .
    image: triagem:2.0
    container_name: triagem
    restart: unless-stopped
    env_file: .env
    environment:
      TRIAGEM_DATA_DIR: /dados
    ports:
      - "8000:8000"
    volumes:
      # Banco e currículos vivem aqui. É o único diretório para fazer backup.
      - ./data:/dados
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
